<style>

.stat{background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:.55rem .4rem;text-align:center}

.dots{display:flex;justify-content:space-between;margin:.4rem 0 1.1rem;gap:0}
.dot{width:44px;height:44px;min-width:0;flex:0 1 44px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;padding:0;cursor:pointer;position:relative}
.dot i{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;font-style:normal;
  font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--line);color:var(--muted);background:var(--bg2);
  transition:transform .15s,background .15s}
.dot.checked i{background:var(--gold);border-color:var(--gold);color:#1a1405}

.dot.today.checked i{box-shadow:0 0 0 3px rgba(232,181,74,.45)}
.dot.missed i{border-style:dashed;border-color:var(--miss);color:var(--miss);background:transparent}
.dot.future{cursor:not-allowed}
.dot.future i{opacity:.4}
.dot.viewing::after{content:"";position:absolute;bottom:0;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--lav)}
.dot:not(.future):hover i{transform:scale(1.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.1rem 1.1rem 1.2rem}
.theme{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 .25rem}
.card h3{font-family:var(--serif);font-weight:normal;font-size:1.3rem;margin:0 0 .6rem}
.med{font-family:var(--serif);font-size:1.08rem;line-height:1.7;margin:0}
.past-note{font-size:.88rem;color:var(--miss);margin:0 0 .6rem}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--gold);font-size:1.3rem;font-weight:400}
details[open] summary::after{content:"\2212"}
details p{font-family:var(--serif);margin:0 0 .9rem;color:var(--text)}
.prayers{margin:1rem 0}
.closing h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 .35rem;font-weight:600}
.closing p{font-family:var(--serif);margin:0;line-height:1.7}
.checkbtn[aria-pressed="true"]{background:var(--gold);color:#1a1405}
.complete{text-align:center;padding-top:1rem}
.complete .flame{width:70px;height:100px;margin:0 auto .5rem;display:block}
.complete h2{font-family:var(--serif);font-weight:normal;font-size:1.6rem;color:var(--gold-soft);margin:.2rem 0}
.complete p{color:var(--muted)}
.tally{font-family:var(--serif);font-size:1.1rem;color:var(--text)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
footer a,footer button.link{display:inline-flex;align-items:center;min-height:44px;padding:0 .5rem}
button.link{background:none;border:0;color:var(--lav);text-decoration:underline;cursor:pointer;font-size:.85rem}
.modal{position:fixed;inset:0;background:rgba(4,8,20,.72);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
#modal{z-index:30}
.box h3{font-family:var(--serif);font-weight:normal;font-size:1.1rem;margin:1.25rem 0 .5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--gold-soft)}
.box h3{scroll-margin-top:1.2rem}
.box h3:first-child{margin-top:0;padding-top:0;border-top:0}
.plist{display:grid;gap:.5rem;margin:.5rem 0}
.pitem{display:flex;align-items:center;gap:.4rem;background:var(--bg2);border:1px solid var(--line);border-radius:.6rem;padding:.25rem .25rem .25rem .7rem}
.pitem div{flex:1;min-width:0}
.pitem b{display:block;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem small{color:var(--muted);font-size:.78rem}
.mini{min-height:44px;min-width:44px;padding:0 .6rem;border-radius:.5rem;border:1px solid var(--line);background:transparent;color:var(--lav);cursor:pointer;font-size:.85rem}
.mini:hover{background:rgba(255,255,255,.06)}
.pform input[type=text],.pform select{width:100%;min-height:48px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .75rem;font:inherit;margin-bottom:.6rem}
.pform textarea{min-height:8rem;margin-bottom:.25rem}
.pform[hidden]{display:none}
.own{margin-top:1rem}
.own details{border-color:var(--line)}
.own details p{white-space:pre-wrap;overflow-wrap:anywhere}
.own .daytag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:600;margin-left:.5rem}
.own .btn{margin-top:.6rem}
.empty-own{font-family:var(--serif);color:var(--muted);margin:0}
.modal[hidden]{display:none}
.modal .box{background:var(--card2);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;width:100%;max-width:22rem;max-height:90dvh;overflow-y:auto}
.gear{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:none;border:0;cursor:pointer;color:var(--lav);border-radius:.6rem}
.gear:hover{background:rgba(255,255,255,.06)}
.gear svg{width:22px;height:22px}
.pick .when{color:var(--gold-soft);font-size:.82rem;margin-top:.35rem}
.trad{font-size:.88rem;color:var(--muted);margin:0 0 .6rem}
.trad b{color:var(--gold-soft);font-weight:600}
.box h2{font-family:var(--serif);font-weight:normal;font-size:1.3rem;margin:0 0 .75rem;color:var(--gold-soft)}
.box .note{font-size:.85rem;color:var(--muted);margin:.5rem 0 0;font-family:var(--sans)}
input[type=time]{width:100%;min-height:48px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .75rem;font:inherit;color-scheme:dark}
a.btn{text-decoration:none}
.modal p{margin:0 0 .5rem;font-family:var(--serif);font-size:1.08rem}
.row{display:flex;gap:.6rem}
.row .btn{flex:1}
.flicker{transform-origin:50% 100%;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.94,1.05)}60%{transform:scale(1.04,.96)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:400px){.topbar{gap:.5rem;padding-left:.75rem;padding-right:.5rem}.topbar h1{font-size:1rem}.home{padding:0 .25rem;font-size:.85rem}}
@media (min-width:700px){main{padding-top:2rem}.list{grid-template-columns:1fr 1fr}}
</style>

<script>
(function(){
"use strict";

var STORE_KEY = "appaday157_novena";
var MAX_INTENT = 140;

var PRAYERS = {
  ourFather: { title: "Our Father", text: "Our Father, who art in heaven, hallowed be thy name; thy kingdom come, thy will be done on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen." },
  hailMary: { title: "Hail Mary", text: "Hail Mary, full of grace, the Lord is with thee. Blessed art thou amongst women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen." },
  gloryBe: { title: "Glory Be", text: "Glory be to the Father, and to the Son, and to the Holy Spirit, as it was in the beginning, is now, and ever shall be, world without end. Amen." }
};

function D(theme, med){ return { theme: theme, med: med }; }

var NOVENAS = {
  "holy-spirit": {
    name: "Novena to the Holy Spirit",
    desc: "Nine days asking for the seven gifts, the oldest novena of the Church.",
    days: [
      D("Come, Holy Spirit", "The apostles waited in the upper room with Mary, praying and unsure of what would come. I wait with them today, emptying my hands so they can be filled. Come, Holy Spirit, and make a home in me."),
      D("Wisdom", "Wisdom sees the world as God sees it, ordered toward love. So much of my worry comes from looking at things too closely and too selfishly. Holy Spirit, grant me wisdom to see my life from heaven's point of view."),
      D("Understanding", "Understanding lets the truths of faith become light rather than mere words. I have heard the Gospel many times, yet parts of it remain closed to me. Holy Spirit, open my mind so that what I believe I may also grasp."),
      D("Counsel", "Counsel is the quiet voice that shows the right path when the way divides. I make many choices each day without asking You at all. Holy Spirit, guide my decisions and teach me to listen before I act."),
      D("Fortitude", "Fortitude is the strength to do good when it costs something. The martyrs had it, and so do the tired parents and caregivers who keep going. Holy Spirit, give me courage to stay faithful when it is hard."),
      D("Knowledge", "Knowledge helps me see created things for what they are, gifts that point beyond themselves. I am tempted to rest my hope in what passes away. Holy Spirit, teach me to use the good things of this world rightly."),
      D("Piety", "Piety is the heart of a child who loves the Father and trusts Him. Prayer is not a duty to finish but a conversation with One who delights in me. Holy Spirit, warm my heart so that I pray as a beloved son or daughter."),
      D("Fear of the Lord", "Holy fear is not terror but awe, the reverence of one who knows how great God is. It keeps me from treating sin lightly and grace casually. Holy Spirit, fill me with wonder before the majesty of God."),
      D("The Fruits of the Spirit", "Where the Spirit lives, love, joy, peace, patience, kindness, and gentleness begin to grow. These are the signs that the gifts have taken root. Holy Spirit, let Your fruit ripen in me so that others may taste Your goodness.")
    ],
    closing: "Holy Spirit, Lord and giver of life, I place this novena and my intention in Your hands. Pour out Your seven gifts on me and on all who seek You, renew the face of the earth, and lead me always to the Father through Jesus Christ our Lord. Amen."
  },
  "divine-mercy": {
    name: "Divine Mercy Novena",
    desc: "Nine days bringing a different group of souls to the ocean of mercy.",
    days: [
      D("All of Humanity", "Today I bring the whole human family before the merciful Heart of Jesus. No one is outside the reach of His love, not even those who have forgotten Him. Jesus, I trust in You; have mercy on us and on the whole world."),
      D("Priests and Religious", "I pray for those who have given their lives to serve the Church. They carry heavy burdens and need grace as much as anyone. Merciful Jesus, strengthen Your priests and religious and keep them close to Your Heart."),
      D("The Faithful", "I remember all who try, imperfectly but sincerely, to follow Christ. Their prayers and small sacrifices hold up the world in hidden ways. Jesus, console Your faithful and keep them steady in grace."),
      D("Those Who Do Not Know Him", "Many have never truly heard of the love of God, or have heard only a distorted version. Mercy goes out to meet them where they are. Jesus, shine Your light on those who do not yet know You."),
      D("Those Separated from the Church", "I pray for Christians who have drifted away or live in division. Christ prayed that all might be one. Merciful Lord, draw all who bear Your name back into unity."),
      D("The Meek and Humble, and Children", "The little and the lowly are especially dear to the Heart of Jesus. Their simplicity makes room for grace. Jesus, make me childlike, and protect every child in Your care."),
      D("Those Who Honor His Mercy", "Some spend their lives proclaiming and practicing mercy toward others. They reflect the face of Christ to a hurting world. Jesus, reward their love and make me one of them."),
      D("The Souls in Purgatory", "I remember those who have died and are being made ready for heaven. My prayers can still reach them and hasten their joy. Merciful Jesus, grant them rest and bring them home to You."),
      D("The Lukewarm", "Lukewarm hearts are not cold, but they are not on fire either, and sometimes that heart is mine. Mercy can rekindle even a faint ember. Jesus, set every lukewarm soul ablaze with love for You.")
    ],
    closing: "Eternal Father, look with mercy on all those I have carried in prayer these nine days. For the sake of the sorrowful Passion of Your Son, have mercy on us and on the whole world. Jesus, I trust in You. Amen."
  },
  "st-jude": {
    name: "Novena to St. Jude",
    desc: "Nine days with the patron of hopeless cases and desperate causes.",
    days: [
      D("Apostle and Friend", "St. Jude walked with Jesus, ate with Him, and was sent out by Him. He knows the Lord as a friend knows a friend. St. Jude, bring my need to the One you followed so closely."),
      D("Hope in Hard Cases", "Some situations look impossible from where I stand. The Church has long turned to St. Jude when every other door seems closed. St. Jude, keep me from despair and hold my hope steady."),
      D("Faith", "St. Jude once asked Jesus why He would show Himself to the disciples and not to the world. He was not afraid to bring honest questions to the Lord. St. Jude, help me pray honestly and believe deeply."),
      D("Perseverance", "Your short letter urges believers to build themselves up in faith and keep themselves in the love of God. Perseverance is faith that does not quit. St. Jude, help me keep praying even when the answer is slow."),
      D("Courage", "Tradition holds that St. Jude carried the Gospel far from home and gave his life for it. Courage is love that is willing to pay a price. St. Jude, give me courage to witness to Christ where I am."),
      D("Kinship with Christ", "St. Jude was counted among the relatives of the Lord. Through baptism I too am brought into His family. St. Jude, help me live as a true brother or sister of Jesus."),
      D("Zeal", "Zeal is a burning desire for God to be known and loved. It can grow cold in the routine of ordinary days. St. Jude, rekindle in me a zeal for the salvation of souls."),
      D("Patience in Trial", "Waiting is often the hardest part of any trouble. God works on a timeline I cannot see. St. Jude, teach me to wait in peace and trust the hidden work of grace."),
      D("Gratitude", "As this novena ends, I thank God for every answer, including the ones I have not recognized yet. Gratitude turns a petition into praise. St. Jude, help me give thanks in all circumstances.")
    ],
    closing: "St. Jude, faithful servant and friend of Jesus, I commend to you my intention and every cause that seems lost. Intercede for me before the throne of God, and obtain for me the grace to accept His will with a trusting heart. Amen."
  },
  "st-joseph": {
    name: "Novena to St. Joseph",
    desc: "Nine days with the guardian of the Holy Family and patron of the Church.",
    days: [
      D("A Just Man", "Scripture calls Joseph a righteous man, and it shows in how gently he planned to protect Mary. Justice in him was always joined to mercy. St. Joseph, make me fair and kind in every dealing."),
      D("The Obedient Dreamer", "Four times God spoke to Joseph in dreams, and each time he rose and acted without delay. His obedience was swift and quiet. St. Joseph, help me hear God's direction and follow it promptly."),
      D("Protector of the Holy Family", "Joseph stood guard over the Child and His Mother in poverty, danger, and exile. Every family needs that kind of watchful love. St. Joseph, protect my family and all families under your care."),
      D("The Worker", "In a small shop in Nazareth, Joseph taught Jesus the dignity of honest labor. Ordinary work, offered to God, becomes holy. St. Joseph, bless my work and help me do it well."),
      D("Silent Faith", "Not a single word of Joseph is recorded in the Gospels. His faith spoke through what he did. St. Joseph, teach me to speak less and trust more."),

/* ---------- traditional dates ---------- */
function easter(y){
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
      h2 = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h2 - k) % 7, m = Math.floor((a + 11 * h2 + 22 * l) / 451),
      month = Math.floor((h2 + l - 7 * m + 114) / 31), day = ((h2 + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

var TRAD = {

  "divine-mercy": { text: "Traditionally begun on Good Friday and finished the day before Divine Mercy Sunday.", start: function(y){ return addDays(easter(y), -2); } },

function fmtShort(d, withYear){
  var o = { month: "short", day: "numeric" };
  if (withYear) o.year = "numeric";
  try { return d.toLocaleDateString(undefined, o); } catch (e) { return d.toDateString(); }
}
/* Next traditional window that has not yet ended, or null for custom. */
function tradWindow(id, today){
  var t = TRAD[id];
  if (!t || !t.start) return null;
  var y = today.getFullYear();
  for (var yy = y; yy <= y + 1; yy++) {
    var s = t.start(yy), e = addDays(s, 8);
    if (e.getTime() >= today.getTime()) return { start: s, end: e, now: s.getTime() <= today.getTime() };
  }
  return null;
}
function tradLine(id, today){
  var w = tradWindow(id, today);
  if (!w) return "";
  var yr = w.start.getFullYear() !== today.getFullYear();
  if (w.now) {
    var n = Math.round((today.getTime() - w.start.getTime()) / 86400000) + 1;
    return "In season now: traditional Day " + n + " of 9, ending " + fmtShort(w.end, false) + ".";
  }
  return "Next traditional start: " + fmtShort(w.start, yr) + " to " + fmtShort(w.end, yr) + ".";
}

function cleanPrayers(list){

  for (var i = 0; i < list.length && out.length < MAX_PRAYERS; i++) {
    var p = list[i];

}

/* ---------- dates (local time, DST safe) ---------- */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function parseLocal(str){
  var p = str.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function dayNumber(st, today){
  if (!st.active) return 0;
  var diff = parseLocal(today).getTime() - parseLocal(st.active.startDate).getTime();
  var n = Math.round(diff / 86400000) + 1;
  return n < 1 ? 1 : n;
}
function daysRemaining(st, today){
  var r = 9 - Math.min(dayNumber(st, today), 9);
  return r < 0 ? 0 : r;
}
function streak(st, today){
  if (!st.active) return 0;
  var c = st.active.checked;
  var dn = dayNumber(st, today);
  function isOn(day){ return day >= 1 && day <= 9 && c[day - 1] === true; }
  var start;
  if (isOn(dn)) start = dn;
  else if (isOn(dn - 1)) start = dn - 1;
  else return 0;
  var n = 0;
  for (var d = start; isOn(d); d--) n++;
  return n;
}

  var dn = dayNumber(state, today);
  var v = views.day; clear(v);

  var head = h("div", { cls: "dhead" }, [flameSvg(), h("div", null, [
    h("h2", { text: n.name }),
    a.intention ? h("p", { cls: "intent", text: "For " + a.intention }) : null
  ])]);
  v.appendChild(head);
  var tl = tradLine(a.novenaId, parseLocal(today));
  v.appendChild(h("p", { cls: "trad" }, [TRAD[a.novenaId].text + (tl ? " " : ""), tl ? h("b", { text: tl }) : null]));

  v.appendChild(h("div", { cls: "stats" }, [
    h("div", { cls: "stat" }, [h("b", { text: "Day " + dn }), h("span", { text: "of 9" })]),
    h("div", { cls: "stat" }, [h("b", { text: String(daysRemaining(state, today)) }), h("span", { text: "days left" })]),
    h("div", { cls: "stat" }, [h("b", { text: String(streak(state, today)) }), h("span", { text: "streak" })])
  ]));

  var dots = h("div", { cls: "dots", role: "group", "aria-label": "Novena progress" });
  for (var i = 1; i <= 9; i++) (function(d){
    var cls = "dot", label = "Day " + d, checked = a.checked[d - 1];
    if (checked) { cls += " checked"; label += ", prayed"; }
    if (d === dn) { cls += " today"; label += ", today"; }
    else if (d > dn) { cls += " future"; label += ", upcoming"; }
    else if (!checked) { cls += " missed"; label += ", not yet prayed"; }
    if (d === vd) cls += " viewing";
    dots.appendChild(h("button", {
      type: "button", cls: cls, "aria-label": label, "aria-current": d === vd ? "true" : false,
      disabled: d > dn,
      onclick: function(){ if (d > dn) return; viewDay = d; renderDay(d); }
    }, [h("i", { text: String(d) })]));
  })(i);
  v.appendChild(dots);

  var day = n.days[vd - 1];
  var med = day.med.split("{intention}").join(a.intention ? a.intention : "my intention");
  var card = h("article", { cls: "card" }, [
    vd < dn ? h("p", { cls: "past-note", text: "Viewing a past day. You can still mark it prayed." }) : null,
    h("p", { cls: "theme", text: "Day " + vd + " meditation" }),
    h("h3", { text: day.theme }),
    h("p", { cls: "med", text: med })
  ]);
  v.appendChild(card);

  if (a.novenaId === "custom") {
    var mine = prayersForDay(vd);
    var own = h("div", { cls: "card own" }, [h("p", { cls: "theme", text: "Your prayers" })]);
    if (mine.length) {
      mine.forEach(function(p){
        var idx = state.customPrayers.indexOf(p);
        own.appendChild(h("details", { open: true }, [
          h("summary", null, [h("span", null, [prayerLabel(p, idx), p.day ? h("span", { cls: "daytag", text: "Day " + p.day }) : null])]),
          h("p", { text: p.text })
        ]));
      });
    } else {
      own.appendChild(h("p", { cls: "empty-own", text: "Add your own prayers, like the prayer card you pray from, to say every day or on a single day." }));
    }
    own.appendChild(h("button", { type: "button", cls: "btn ghost", text: mine.length ? "Add or edit your prayers" : "Add a prayer", onclick: function(){ openSettings("prayers"); } }));
    v.appendChild(own);
  }

  var pr = h("div", { cls: "prayers" });
  ["ourFather", "hailMary", "gloryBe"].forEach(function(k){
    pr.appendChild(h("details", null, [h("summary", { text: PRAYERS[k].title }), h("p", { text: PRAYERS[k].text })]));
  });
  v.appendChild(pr);

  v.appendChild(h("div", { cls: "card closing" }, [h("h4", { text: "Closing prayer" }), h("p", { text: n.closing })]));

  var on = a.checked[vd - 1];
  v.appendChild(h("button", {
    type: "button", cls: "btn checkbtn", "aria-pressed": on ? "true" : "false",
    text: on ? "Day " + vd + " prayed" : "Mark Day " + vd + " prayed",
    onclick: function(){ toggleCheck(vd); }
  }));
  v.appendChild(h("button", { type: "button", cls: "btn ghost", text: "Begin a different novena", onclick: beginNew }));
  show("day");
}

function toggleCheck(d){
  var a = state.active; if (!a) return;
  var dn = dayNumber(state, todayStr());
  if (d < 1 || d > 9 || d > dn) return;
  a.checked[d - 1] = !a.checked[d - 1];
  if (allChecked(a) && !a.done) {
    a.done = true;
    state.completed += 1;
    saveState(); renderComplete(); window.scrollTo(0, 0);
    return;
  }
  saveState(); renderDay(d);
}

function renderComplete(){
  var a = state.active, n = getNovena(a.novenaId), v = views.complete; clear(v);
  var prayed = 0; for (var i = 0; i < 9; i++) if (a.checked[i]) prayed++;
  var full = prayed === 9;
  v.appendChild(h("div", { cls: "complete" }, [
    flameSvg(),
    h("h2", { text: full ? "Novena complete" : "Your nine days are finished" }),
    h("p", { cls: "tally", text: n.name }),
    a.intention ? h("p", { cls: "intent", text: "For " + a.intention }) : null,
    h("p", { text: full ? "All nine days prayed. Thanks be to God." : prayed + " of 9 days prayed. God sees every prayer offered." }),
    h("p", { text: "Novenas completed: " + state.completed }),
    h("div", { cls: "card closing", style: "text-align:left;margin-top:1rem" }, [h("h4", { text: "Closing prayer" }), h("p", { text: n.closing })]),
    h("button", { type: "button", cls: "btn gold", text: "Begin a new novena", onclick: beginNew })
  ]));
  show("complete");
}

function beginNew(){
  var a = state.active;
  var finished = a && (a.done || dayNumber(state, todayStr()) > 9);
  function go(){ state.active = null; viewDay = null; selectedId = null; saveState(); render(); window.scrollTo(0, 0); }
  if (finished) { go(); return; }
  askConfirm("End this novena and choose a new one? Your progress on it will be cleared.", "End novena", go);
}

document.getElementById("reset-link").addEventListener("click", function(){
  askConfirm("Erase all data, including your current novena, completed count, and custom prayers?", "Erase", function(){
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state = emptyState(); viewDay = null; selectedId = null; render(); window.scrollTo(0, 0);
  });
});

document.addEventListener("visibilitychange", function(){ if (!document.hidden && modal.hidden && settings.hidden) { viewDay = null; render(); } });

/* ---------- calendar reminders ---------- */
var DEFAULT_TIME = "20:00";
var MIN_TIME = "06:30";
function userTz(){
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; }
}
function dayLink(id, d){ return APP_URL + "#novena=" + id + (d ? "&day=" + d : ""); }
function stamp(d){ /* local wall time, no zone */
  return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
}
function utcStamp(d){
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
}
function icsEsc(s){ return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function fold(line){ /* RFC 5545: lines of at most 75 octets */
  var enc = typeof TextEncoder !== "undefined" ? new TextEncoder() : null;
  var out = [], cur = "", bytes = 0, limit = 75;
  for (var i = 0; i < line.length; i++) {
    var ch = line.charAt(i);
    var code = line.charCodeAt(i);
    if (code >= 0xD800 && code <= 0xDBFF && i + 1 < line.length) { ch += line.charAt(++i); }
    var b = enc ? enc.encode(ch).length : 1;
    if (bytes + b > limit) { out.push(cur); cur = " "; bytes = 1; limit = 75; }
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join("\r\n");
}
function offStr(min){
  var s = min < 0 ? "-" : "+"; min = Math.abs(min);
  return s + pad(Math.floor(min / 60)) + pad(min % 60);
}
/* Returns VTIMEZONE lines, or null to fall back to floating local times. */
function vtimezone(tz){
  if (tz === "America/Chicago") return [
    "BEGIN:VTIMEZONE", "TZID:America/Chicago", "X-LIC-LOCATION:America/Chicago",
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:-0600", "TZOFFSETTO:-0500", "TZNAME:CDT",
    "DTSTART:19700308T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:-0500", "TZOFFSETTO:-0600", "TZNAME:CST",
    "DTSTART:19701101T020000", "RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU", "END:STANDARD",
    "END:VTIMEZONE"];
  if (!tz) return null;
  var y = new Date().getFullYear();
  var jan = -new Date(y, 0, 1).getTimezoneOffset(), jul = -new Date(y, 6, 1).getTimezoneOffset();
  if (jan === jul) return ["BEGIN:VTIMEZONE", "TZID:" + tz, "BEGIN:STANDARD",
    "TZOFFSETFROM:" + offStr(jan), "TZOFFSETTO:" + offStr(jan), "DTSTART:19700101T000000", "END:STANDARD", "END:VTIMEZONE"];
  if (tz.indexOf("America/") === 0 && jul > jan) return ["BEGIN:VTIMEZONE", "TZID:" + tz,
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:" + offStr(jan), "TZOFFSETTO:" + offStr(jul),
    "DTSTART:19700308T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:" + offStr(jul), "TZOFFSETTO:" + offStr(jan),
    "DTSTART:19701101T020000", "RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU", "END:STANDARD",
    "END:VTIMEZONE"];
  return null;
}
function reminderDays(){
  var a = state.active; if (!a) return [];
  var dn = dayNumber(state, todayStr()), list = [];
  for (var d = Math.max(dn, 1); d <= 9; d++) list.push(d);
  return list;
}
function eventStart(d, time){
  var base = addDays(parseLocal(state.active.startDate), d - 1), p = time.split(":");
  return new Date(base.getFullYear(), base.getMonth(), base.getDate(), +p[0], +p[1]);
}
function buildIcs(time){
  var a = state.active, n = getNovena(a.novenaId), tz = userTz(), vt = vtimezone(tz);
  var now = utcStamp(new Date());
  var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//AppADay//Novena Companion 157//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
           "X-WR-CALNAME:" + icsEsc(n.name)];
  if (vt) L = L.concat(vt);
  reminderDays().forEach(function(d){
    var s = eventStart(d, time), e = new Date(s.getTime() + 15 * 60000);
    var link = dayLink(a.novenaId, d);
    var desc = "Day " + d + " of 9: " + n.days[d - 1].theme + "." + (a.intention ? "\nFor " + a.intention : "") + "\n\nPray today: " + link;
    var zone = vt ? ";TZID=" + tz : "";
    L.push("BEGIN:VEVENT",
      "UID:appaday157-" + a.startDate + "-" + a.novenaId + "-d" + d + "@augustineiacopelli.github.io",
      "DTSTAMP:" + now,
      "DTSTART" + zone + ":" + stamp(s),
      "DTEND" + zone + ":" + stamp(e),
      "SUMMARY:" + icsEsc("Novena Day " + d + ": " + n.name),
      "DESCRIPTION:" + icsEsc(desc),
      "URL:" + link,
      "CLASS:PRIVATE",
      "TRANSP:TRANSPARENT",
      "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:PT0M",
      "DESCRIPTION:" + icsEsc("Time to pray Day " + d + " of your novena"),
      "END:VALARM",
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n") + "\r\n";
}
function googleUrl(time){
  var a = state.active, n = getNovena(a.novenaId), days = reminderDays(), tz = userTz();
  var s = eventStart(days[0], time), e = new Date(s.getTime() + 15 * 60000);
  var details = "Pray today's novena day: " + dayLink(a.novenaId) + (a.intention ? "\nFor " + a.intention : "");
  var q = "action=TEMPLATE&text=" + encodeURIComponent("Novena: " + n.name) +
    "&dates=" + stamp(s) + "/" + stamp(e) +
    (tz ? "&ctz=" + encodeURIComponent(tz) : "") +
    (days.length > 1 ? "&recur=" + encodeURIComponent("RRULE:FREQ=DAILY;COUNT=" + days.length) : "") +
    "&details=" + encodeURIComponent(details);
  return "https://calendar.google.com/calendar/render?" + q;
}
function downloadIcs(time){
  var text = buildIcs(time), name = "novena-" + state.active.novenaId + ".ics";
  var standalone = window.navigator.standalone === true;
  if (standalone) { window.location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(text); return; }
  try {
    var url = URL.createObjectURL(new Blob([text], { type: "text/calendar;charset=utf-8" }));
    var link = h("a", { href: url, download: name, style: "display:none" });
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  } catch (e) {
    window.location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(text);
  }
}

var settings = document.getElementById("settings");
var settingsBody = document.getElementById("settings-body");
var settingsClose = document.getElementById("settings-close");
function openSettings(focusSection){
  buildSettings();
  if (!settings.hidden) return;
  settingsFocus = document.activeElement;
  settings.hidden = false;
  var target = focusSection === "prayers" ? document.getElementById("prayers-head") : null;
  if (target && target.scrollIntoView) target.scrollIntoView({ block: "start" });
  settingsClose.focus();
}

var editingId = null;
function buildPrayerSection(){
  var list = state.customPrayers;
  settingsBody.appendChild(h("h3", { id: "prayers-head", text: "Custom novena prayers" }));
  settingsBody.appendChild(h("p", { cls: "note", style: "margin-top:0", text: "Add your own prayers to the Custom Novena. Each one shows every day, or only on the day you choose. They stay saved for future custom novenas." }));
  if (list.length) {
    var ul = h("div", { cls: "plist" });
    list.forEach(function(p, i){
      ul.appendChild(h("div", { cls: "pitem" }, [
        h("div", null, [h("b", { text: prayerLabel(p, i) }), h("small", { text: p.day ? "Day " + p.day + " only" : "Every day" })]),
        h("button", { type: "button", cls: "mini", "aria-label": "Edit " + prayerLabel(p, i), text: "Edit", onclick: function(){ editingId = p.id; buildSettings(); focusForm(); } }),
        h("button", { type: "button", cls: "mini", "aria-label": "Delete " + prayerLabel(p, i), text: "Delete", onclick: function(){
          askConfirm("Delete \u201c" + prayerLabel(p, i) + "\u201d?", "Delete", function(){
            state.customPrayers = state.customPrayers.filter(function(x){ return x.id !== p.id; });
            if (editingId === p.id) editingId = null;
            saveState(); buildSettings(); rerenderBehind();
          });
        } })
      ]));
    });
    settingsBody.appendChild(ul);
  }
  var editing = null;
  for (var k = 0; k < list.length; k++) if (list[k].id === editingId) editing = list[k];
  if (!editing) editingId = null;
  if (!editing && list.length >= MAX_PRAYERS) {
    settingsBody.appendChild(h("p", { cls: "note", text: "You have reached the limit of " + MAX_PRAYERS + " prayers." }));
    return;
  }
  var title = h("input", { type: "text", id: "p-title", maxlength: String(MAX_PTITLE), placeholder: "Title, such as Prayer to St. Therese", value: editing ? editing.title : "" });
  var text = h("textarea", { id: "p-text", maxlength: String(MAX_PTEXT), placeholder: "Type or paste the prayer" });
  text.value = editing ? editing.text : "";
  var sel = h("select", { id: "p-day" });
  sel.appendChild(h("option", { value: "0", text: "Every day" }));
  for (var d = 1; d <= 9; d++) sel.appendChild(h("option", { value: String(d), text: "Day " + d + " only" }));
  sel.value = String(editing ? editing.day : 0);
  var count = h("div", { cls: "count", text: text.value.length + " / " + MAX_PTEXT });
  var save = h("button", { type: "button", cls: "btn", text: editing ? "Save changes" : "Add prayer" });
  function upd(){ count.textContent = text.value.length + " / " + MAX_PTEXT; save.disabled = !text.value.trim(); }
  text.addEventListener("input", upd); upd();
  save.addEventListener("click", function(){
    var body = text.value.slice(0, MAX_PTEXT);
    if (!body.trim()) return;
    var rec = { id: editing ? editing.id : newPrayerId(), title: title.value.trim().slice(0, MAX_PTITLE), text: body, day: +sel.value || 0 };
    if (editing) state.customPrayers = state.customPrayers.map(function(x){ return x.id === rec.id ? rec : x; });
    else state.customPrayers.push(rec);
    editingId = null;
    saveState(); buildSettings(); rerenderBehind();
    var head = document.getElementById("prayers-head"); if (head && head.scrollIntoView) head.scrollIntoView({ block: "start" });
  });
  var form = h("div", { cls: "pform" }, [
    h("label", { "for": "p-title", text: editing ? "Edit prayer" : "New prayer" }), title,
    h("label", { "for": "p-text", text: "Prayer text" }), text, count,
    h("label", { "for": "p-day", style: "margin-top:.5rem", text: "Pray it on" }), sel, save,
    editing ? h("button", { type: "button", cls: "btn ghost", text: "Cancel edit", onclick: function(){ editingId = null; buildSettings(); } }) : null
  ]);
  settingsBody.appendChild(form);
}
function focusForm(){ var t = document.getElementById("p-title"); if (t) { if (t.scrollIntoView) t.scrollIntoView({ block: "center" }); t.focus(); } }
function rerenderBehind(){ if (state.active && views.day && !views.day.hidden) renderDay(viewDay || dayNumber(state, todayStr())); }

function buildSettings(){
  clear(settingsBody);
  var a = state.active;
  var dn = a ? dayNumber(state, todayStr()) : 0;
  settingsBody.appendChild(h("h3", { text: "Calendar reminders" }));
  if (!a || a.done || dn > 9) {
    settingsBody.appendChild(h("p", { cls: "note", style: "margin-top:0", text: "Begin a novena first, then come back here to add its nine days to your calendar." }));
  } else {
    var n = getNovena(a.novenaId), days = reminderDays();
    var time = h("input", { type: "time", id: "rem-time", min: MIN_TIME, step: "300", value: state.reminderTime || DEFAULT_TIME });
    var gLink = h("a", { cls: "btn ghost", target: "_blank", rel: "noopener", text: "Add to Google Calendar" });
    function cur(){ var t = time.value || DEFAULT_TIME; if (t < MIN_TIME) t = MIN_TIME; return t; }
    function sync(){ gLink.href = googleUrl(cur()); }
    time.addEventListener("change", function(){ if (time.value && time.value < MIN_TIME) time.value = MIN_TIME; state.reminderTime = cur(); saveState(); sync(); });
    sync();
    settingsBody.appendChild(h("p", { cls: "note", style: "margin-top:0", text: n.name + ", Days " + days[0] + (days.length > 1 ? " to 9" : "") + ". One private reminder per day, each linking straight to that day's prayer." }));
    settingsBody.appendChild(h("label", { "for": "rem-time", style: "margin-top:.75rem", text: "Daily reminder time" }));
    settingsBody.appendChild(time);
    settingsBody.appendChild(h("button", { type: "button", cls: "btn gold", text: "Download calendar file (.ics)", onclick: function(){ downloadIcs(cur()); } }));
    settingsBody.appendChild(h("p", { cls: "note", text: "Opens in Outlook and Apple Calendar, and imports into Google Calendar under Settings, Import and export." }));
    settingsBody.appendChild(gLink);
    settingsBody.appendChild(h("p", { cls: "note", text: "Google's quick add makes one repeating event that opens your current day." + (userTz() ? " Times are in " + userTz() + "." : "") }));
  }
  buildPrayerSection();
}
var settingsFocus = null;
function closeSettings(){ settings.hidden = true; editingId = null; if (settingsFocus && settingsFocus.focus && document.body.contains(settingsFocus)) settingsFocus.focus(); }
document.getElementById("gear").addEventListener("click", function(){ editingId = null; openSettings(); });
settingsClose.addEventListener("click", closeSettings);
settings.addEventListener("click", function(e){ if (e.target === settings) closeSettings(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !settings.hidden && modal.hidden) closeSettings(); });

/* ---------- deep links: #novena=<id>&day=<n> ---------- */
function applyHash(){
  var hs = window.location.hash || "";
  var mId = /novena=([a-z-]+)/.exec(hs), mDay = /day=(\d)/.exec(hs);
  if (!mId || !getNovena(mId[1])) return false;
  try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) {}
  var id = mId[1], a = state.active;
  if (a && a.novenaId === id) {
    var dn = dayNumber(state, todayStr());
    viewDay = mDay ? Math.max(1, Math.min(+mDay[1], dn, 9)) : null;
  } else if (!a) {
    selectedId = id;
  }
  return true;
}
window.addEventListener("hashchange", function(){ if (applyHash()) { render(); window.scrollTo(0, 0); } });

window.__novena = { todayStr: todayStr, parseLocal: parseLocal, dayNumber: dayNumber, daysRemaining: daysRemaining, streak: streak, buildIcs: buildIcs, googleUrl: googleUrl, tradLine: tradLine };

applyHash();
render();
})();
</script>
</body>
